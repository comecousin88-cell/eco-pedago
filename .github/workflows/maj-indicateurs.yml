# Chaque matin : interroge la BCE, Eurostat et l'Insee, met à jour data/,
# lance les tests, le contrôle du code et la construction du site, puis publie
# (commit sur main) seulement si tout passe. Vercel redéploie à chaque commit.
# Si une source ne répond pas, ses dernières valeurs sont conservées avec leur
# date ; si les tests échouent, rien n'est publié et GitHub envoie un courriel.
name: Mise à jour des indicateurs

on:
  schedule:
    - cron: "15 5 * * *" # 5 h 15 UTC, soit 6 h 15 ou 7 h 15 à Paris
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: maj-indicateurs
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Interroger les sources et mettre à jour data/
        run: npm run maj:indicateurs

      - name: Tests
        run: npm test

      - name: Contrôle du code
        run: npm run lint

      - name: Construire le site
        run: npm run build

      - name: Publier les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ A_VERIFIER.md
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
            exit 0
          fi
          git commit -m "Indicateurs : mise à jour automatique du $(date -u +%F)"
          git push
