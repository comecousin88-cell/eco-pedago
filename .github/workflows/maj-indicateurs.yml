# Trois fois par jour ouvré : interroge la BCE, Eurostat, l'Insee et,
# si la clé est enregistrée, la Banque de France ; met à jour data/, lance les
# tests, le contrôle du code et la construction du site, puis publie (commit
# sur main) seulement si tout passe. Vercel redéploie à chaque commit.
# Reprend aussi, tels quels, les résumés rédigés par les organismes (chapô ou
# introduction) quand leur licence le permet ; le récapitulatif est écrit dans
# RECAPITULATIF.md.
# Les événements (notes, budget) passent par la tâche « Veille de l'agenda »,
# dont les demandes sont fusionnées par « Fusion automatique » si tout passe.
# Si une source ne répond pas, ses dernières valeurs sont conservées avec leur
# date ; si les tests échouent, rien n'est publié et GitHub envoie un courriel.
name: Mise à jour des indicateurs

on:
  schedule:
    # Trois passages par jour ouvré (heures UTC ; +1 h en hiver, +2 h en été à Paris) :
    # 7 h 15, après les publications de l'Insee (7 h 30 ou 8 h 45 à Paris) ;
    # 12 h 15, après celles d'Eurostat (11 h) et les annonces de la BCE (14 h 15 les jours de réunion : rattrapé le soir) ;
    # 17 h 30, après la mise à jour quotidienne des taux de la BCE.
    - cron: "15 7 * * 1-5"
    - cron: "15 12 * * 1-5"
    - cron: "30 17 * * 1-5"
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: maj-indicateurs
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Interroger les sources et mettre à jour data/
        run: npm run maj:indicateurs
        env:
          # Facultatif : clé gratuite de l'API Webstat (taux à 10 ans quotidien).
          WEBSTAT_CLIENT_ID: ${{ secrets.WEBSTAT_CLIENT_ID }}

      - name: Lire les flux d'actualités officiels
        run: npm run maj:actu

      - name: Reprendre les résumés officiels des nouvelles publications
        run: npm run resumes:officiels
        continue-on-error: true # un site injoignable ne doit pas bloquer la mise à jour des chiffres

      - name: Tests
        run: npm test

      - name: Contrôle du code
        run: npm run lint

      - name: Construire le site
        run: npm run build

      - name: Publier les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ A_VERIFIER.md RECAPITULATIF.md
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
            exit 0
          fi
          git commit -m "Indicateurs : mise à jour automatique du $(date -u +%F)"
          git push
